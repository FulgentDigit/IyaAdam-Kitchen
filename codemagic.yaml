workflows:
  android-workflow:
    name: IyaAdam Kitchen Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      groups:
        - android_signing

    scripts:
      - name: Prepare signing keystore
        script: |
          echo "Combining keystore Base64 parts..."

          printf '%s' "$KEYSTORE_PART_A$KEYSTORE_PART_B" > "$CM_BUILD_DIR/keystore.b64"

          base64 --decode \
            "$CM_BUILD_DIR/keystore.b64" \
            > "$CM_BUILD_DIR/iyaadam.keystore"

          test -s "$CM_BUILD_DIR/iyaadam.keystore"

          echo "Testing keystore..."

          keytool -list \
            -keystore "$CM_BUILD_DIR/iyaadam.keystore" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore verified successfully."

      - name: Build Android Release
        script: |
          cd "$CM_BUILD_DIR"

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew clean bundleRelease

    artifacts:
      - app/build/outputs/bundle/release/app-release.aab

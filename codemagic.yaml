workflows:
  android-workflow:
    name: IyaAdam Kitchen Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      groups:
        - android_signing

    scripts:
      - name: Set up and verify release keystore
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/iyaadam.keystore"

          test -s "$CM_BUILD_DIR/iyaadam.keystore"

          keytool -list \
            -keystore "$CM_BUILD_DIR/iyaadam.keystore" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore verification successful."

      - name: Build Android Release
        script: |
          cd "$CM_BUILD_DIR"
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew clean bundleRelease

    artifacts:
      - app/build/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your@email.com

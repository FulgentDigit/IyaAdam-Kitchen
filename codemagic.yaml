workflows:
  android-workflow:
    name: IyaAdam Kitchen APK Build

    max_build_duration: 60

    instance_type: mac_mini_m2

    environment:
      android_signing:
        - iyaadam-release

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

      java: 17

    scripts:
      - name: Generate Gradle Wrapper
        script: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper is missing."
            exit 1
          fi
          chmod +x gradlew

      - name: Clean Previous Build
        script: |
          ./gradlew clean

      - name: Build Signed Release APK
        script: |
          ./gradlew assembleRelease --stacktrace

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients: []

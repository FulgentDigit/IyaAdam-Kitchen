
workflows:
  android:
    name: IyaAdam Kitchen Android AAB
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - iyaadam-release

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

      java: 17

    scripts:
      - name: Check Android Project
        script: |
          echo "Checking Android project files..."
          ls -la

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Generate Gradle Wrapper
        script: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing. Generating wrapper..."
            gradle wrapper --gradle-version 8.14.1
          else
            echo "Existing Gradle wrapper found."
          fi

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper generation failed."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Clean Previous Build
        script: |
          ./gradlew clean

      - name: Build Signed Release AAB
        script: |
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB
        script: |
          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "SIGNED AAB BUILD SUCCESSFUL"
          ls -lh "$AAB"

    artifacts:
      - app/build/outputs/bundle/release/*.aab

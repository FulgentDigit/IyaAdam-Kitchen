workflows:
  android-workflow:
    name: IyaAdam Kitchen Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Build Android Release
        script: |
          chmod +x gradlew
          ./gradlew clean bundleRelease

    artifacts:
      - app/build/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your@email.com

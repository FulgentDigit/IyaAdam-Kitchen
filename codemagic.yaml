workflows:
  workflows:
    name: IyaAdam Kitchen Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - iyaadam-release

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

      java: 17

    scripts:
      - name: Check Gradle Wrapper
        script: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Verify Release Signing
        script: |
          if [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            echo "ERROR: Release keystore is missing."
            exit 1
          fi
          if [ -z "${CM_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${CM_KEY_ALIAS:-}" ] || \
             [ -z "${CM_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Release signing credentials are incomplete."
            exit 1
          fi
          echo "Release signing credentials are available."

      - name: Clean Previous Build
        script: |
          ./gradlew clean

      - name: Build Signed Release APK
        script: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK Output
        script: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

    artifacts:
      - app/build/outputs/apk/release/*.apk

workflows:
  android-workflow:
    name: IyaAdam Kitchen Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      groups:
        - android_signing

    scripts:
      - name: Set up release keystore
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/iyaadam.keystore"
          ls -l "$CM_BUILD_DIR/iyaadam.keystore"

      - name: Build Android Release
        script: |
          chmod +x gradlew
          ./gradlew clean bundleRelease

    artifacts:
      - app/build/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your@email.com

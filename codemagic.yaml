workflows:
  android-workflow:
    name: IyaAdam Kitchen Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

      groups:
        - android_signing

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

    scripts:
      - name: Check project files
        script: |
          echo "===== IYAADAM KITCHEN ====="
          pwd
          ls -la

          echo "===== GRADLE WRAPPER ====="
          ls -la gradle/wrapper || true

          echo "===== SIGNING CONFIGURATION CHECK ====="
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            echo "Keystore path variable is configured."
          else
            echo "ERROR: CM_KEYSTORE_PATH is missing."
            exit 1
          fi

          if [ -n "$CM_KEYSTORE_PASSWORD" ] && \
             [ -n "$CM_KEY_ALIAS" ] && \
             [ -n "$CM_KEY_PASSWORD" ]; then
            echo "Signing credential variables are configured."
          else
            echo "ERROR: One or more signing credential variables are missing."
            exit 1
          fi

          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file not found at configured path."
            exit 1
          fi

          echo "Keystore file is available."

      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 8.14.1

      - name: Make Gradle executable
        script: |
          chmod +x gradlew

      - name: Build Android App Bundle
        script: |
          ./gradlew clean
          ./gradlew bundleRelease --stacktrace

    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk

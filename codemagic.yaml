
workflows:
  android:
    name: IyaAdam Kitchen Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - iyaadam-release

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

      java: 17

    scripts:
      - name: Check Android Project
        script: |
          echo "Checking Android project files..."
          ls -la

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

      - name: Generate Gradle Wrapper
        script: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper missing. Generating wrapper..."
            gradle wrapper --gradle-version 8.14.1
          else
            echo "Existing Gradle wrapper found."
          fi

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper generation failed."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Clean Previous Build
        script: |
          ./gradlew clean

      - name: Build Signed Release APK
        script: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        script: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

    artifacts:
      - app/build/outputs/apk/release/*.apk

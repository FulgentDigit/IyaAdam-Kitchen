workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    environment:
      java: 11
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Build APK
        script: gradle clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - your@email.com

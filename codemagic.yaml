workflows:
  android-workflow:
    name: IyaAdam Kitchen Android
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

      android_signing:
        - iyaadam-release

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

    scripts:
      - name: Check project files
        script: |
          echo "===== IYAADAM KITCHEN ====="
          pwd
          ls -la
          echo "===== SIGNING CHECK ====="
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore path is missing."
            exit 1
          fi
          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file is not available."
            exit 1
          fi
          echo "Existing IyaAdam keystore is available."

      - name: Generate Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 8.14.1

      - name: Make Gradle executable
        script: |
          chmod +x gradlew

      - name: Build Android App Bundle
        script: |
          ./gradlew clean
          ./gradlew bundleRelease --stacktrace

    artifacts:
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/*.apk

workflows:
  android:
    name: IyaAdam Kitchen Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - iyaadam-release

      vars:
        PACKAGE_NAME: "com.iyaadam.app"

      java: 17

    scripts:
      - name: Prepare Gradle
        script: |
          chmod +x ./gradlew

      - name: Clean Project
        script: |
          ./gradlew clean

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        script: |
          test -f app/build/outputs/apk/release/app-release.apk

    artifacts:
      - app/build/outputs/apk/release/*.apk

plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'com.iyaadam.app'

    defaultConfig {
        applicationId "com.iyaadam.app"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("CM_KEYSTORE_PATH"))
            storePassword System.getenv("CM_KEYSTORE_PASSWORD")
            keyAlias System.getenv("CM_KEY_ALIAS")
            keyPassword System.getenv("CM_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            signingConfig signingConfigs.release

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
}

Then check these two things

Your Codemagic YAML should contain:

environment:
  java: 17

  android_signing:
    - iyaadam-release

And your "build.gradle" now contains:

signingConfig signingConfigs.release

That means the chain is:

Codemagic → "iyaadam-release" → original JKS → "iyaadam-upload" alias → release AAB

One important correction

Earlier you told me the project package is "com.iyaadam.app", and this Gradle file confirms it. Good.

Now save both files and commit/push them to GitHub "main".

Then go back to Codemagic and start:

Start new build → "android-workflow" → "main"

If the build fails, don't change anything yet. Send me the error and we'll fix the specific failure.
